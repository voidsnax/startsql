<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.75 12.75 32.5 34.5">
  <!-- Black Outline Layer (Visible on white backgrounds) -->
  <g stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="32" cy="20" rx="14" ry="5"/>
    <path d="M18,20 v10 c0,2.76 6.27,5 14,5 s14,-2.24 14,-5 v-10"/>
    <path d="M18,30 v10 c0,2.76 6.27,5 14,5 s14,-2.24 14,-5 v-10"/>
  </g>

  <!-- 2. White Inner Layer -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="32" cy="20" rx="14" ry="5"/>
    <path d="M18,20 v10 c0,2.76 6.27,5 14,5 s14,-2.24 14,-5 v-10"/>
    <path d="M18,30 v10 c0,2.76 6.27,5 14,5 s14,-2.24 14,-5 v-10"/>
  </g>

  <!-- Play Button: White fill with a thin black border -->
  <polygon points="30,18 36,20 30,22" fill="#ffffff" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>
</svg>